<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f1eb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="{{ page.description | escape }}" />
    <title>{{ page.title | escape }} | AHK Architects</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="./assets/ahk-logo.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AHK Architects" />
    <meta property="og:title" content="{{ page.title | escape }} | AHK Architects" />
    <meta property="og:description" content="{{ page.description | escape }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="https://ahkarchitects.github.io/assets/social-preview.png?v=5" />
    <meta property="og:image:alt" content="AHK Architects — Architecture, Interiors, Landscape. By Arishella Harish Kumar." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | escape }} | AHK Architects" />
    <meta name="twitter:description" content="{{ page.description | escape }}" />
    <meta name="twitter:image" content="https://ahkarchitects.github.io/assets/social-preview.png?v=5" />
    <link rel="stylesheet" href="./theme.css" />
    <script src="./theme.js"></script>
    <script src="./site-intro.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./site-navigation.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./" aria-label="AHK Architects home">
        <img class="brand-logo" src="./assets/ahk-logo.svg" alt="" width="640" height="662" />
        <span class="brand-copy">
          <span class="wordmark">AHK Architects<span>.</span></span>
          <span class="brand-services">
            Architecture <span aria-hidden="true">·</span> Interiors <span aria-hidden="true">·</span> Landscape
          </span>
        </span>
      </a>
      <div class="header-contacts">
        <nav class="contact-links" data-contact-links-source aria-label="Contact AHK Architects">
          <a class="contact-link whatsapp-link" href="https://wa.me/917780412526" target="_blank" rel="noopener noreferrer" aria-label="Contact AHK Architects on WhatsApp (opens in a new tab)">
            <img src="https://cdn.simpleicons.org/whatsapp/25D366" alt="" width="24" height="24" referrerpolicy="no-referrer" />
            WhatsApp
          </a>
          <a class="contact-link email-link" href="mailto:arishellaharish@gmail.com" aria-label="Email AHK Architects">
            <img src="https://cdn.simpleicons.org/gmail/EA4335" alt="" width="24" height="24" referrerpolicy="no-referrer" />
            Email
          </a>
        </nav>
      </div>
      <div class="header-tools">
        <div class="theme-toolbar" hidden>
          <fieldset class="theme-control">
            <legend class="sr-only">Theme</legend>
            <label>
              <input class="sr-only" type="radio" name="theme" value="system" checked />
              <span>System</span>
            </label>
            <label>
              <input class="sr-only" type="radio" name="theme" value="light" />
              <span>Light</span>
            </label>
            <label>
              <input class="sr-only" type="radio" name="theme" value="dark" />
              <span>Dark</span>
            </label>
          </fieldset>
        </div>
        <details class="site-menu">
          <summary>
            <svg class="menu-open-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h16M2 10h16M2 16h16" /></svg>
            <span class="menu-open-label sr-only">Menu</span>
            <span class="menu-close-label">Close <span aria-hidden="true">&times;</span></span>
          </summary>
          <nav class="menu-panel" aria-label="Main navigation">
            <a href="./">Home</a>
            <a href="./about.html">About us</a>
            <a href="./architecture.html"{% if page.service == "architecture" %} aria-current="page"{% endif %}>Architecture</a>
            <a href="./interiors.html"{% if page.service == "interiors" %} aria-current="page"{% endif %}>Interiors</a>
            <a href="./landscape.html"{% if page.service == "landscape" %} aria-current="page"{% endif %}>Landscape</a>
            <a href="./contact.html">Contact us</a>
          </nav>
        </details>
      </div>
    </header>

    <main class="service-page" aria-labelledby="service-title">
      <h1 id="service-title">{{ page.title | escape }}</h1>
      <div class="service-content">
        {{ content }}
      </div>
    </main>
    <footer class="site-footer">
      <p class="footer-note">&copy; 2026 AHK Architects <span>&middot;</span> Thoughtfully designed, beautifully lived.</p>
    </footer>
  </body>
</html>
